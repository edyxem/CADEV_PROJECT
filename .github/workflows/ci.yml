name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: afridev
          POSTGRES_USER: afridev
          POSTGRES_PASSWORD: afridev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afridev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://afridev:afridev@localhost:5432/afridev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Migrations are up to date
        run: python backend/manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Deployment checks (production settings)
        run: python backend/manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
          DJANGO_ALLOWED_HOSTS: api.example.org
      - name: OpenAPI schema is valid
        run: python backend/manage.py spectacular --file openapi.yaml --validate --fail-on-warn
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Tests with coverage
        run: python -m pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-and-schema
          path: |
            coverage.xml
            openapi.yaml
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/Dockerfile -t afridev-backend:ci .
