services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-afridev}
      POSTGRES_USER: ${POSTGRES_USER:-afridev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afridev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afridev} -d ${POSTGRES_DB:-afridev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-demo-secret-key-change-me-before-any-deployment}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://${POSTGRES_USER:-afridev}:${POSTGRES_PASSWORD:-afridev}@db:5432/${POSTGRES_DB:-afridev}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # Démonstration locale en HTTP : à repasser à True derrière un proxy HTTPS.
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
      DJANGO_COOKIE_SECURE: ${DJANGO_COOKIE_SECURE:-False}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-False}
      DJANGO_SERVE_MEDIA: ${DJANGO_SERVE_MEDIA:-True}
      DJANGO_MEDIA_ROOT: /app/media
      SEED_REFERENCE: ${SEED_REFERENCE:-1}
      SEED_DEMO: ${SEED_DEMO:-0}
    volumes:
      - media_data:/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"

volumes:
  postgres_data:
  media_data:
