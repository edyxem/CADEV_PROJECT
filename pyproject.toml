[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "C4", "SIM", "T20"]
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config"]

[tool.ruff.lint.per-file-ignores]
"**/management/commands/*" = ["T20"]
"backend/common/demo_data.py" = ["E501"]
"**/tests/*" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["backend"]
testpaths = ["backend"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.coverage.run]
source = ["backend/apps", "backend/common"]
branch = true
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
